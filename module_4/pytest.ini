[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers --cov=src --cov-report=term-missing --cov-fail-under=100
markers =
    web: Flask routes and page structure
    buttons: Pull Data, Update Analysis and busy behavior
    analysis: Analysis queries and formatting
    db: Database schema, inserts and selects
    integration: End-to-end and ETL workflows
